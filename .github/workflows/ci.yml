name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Supersede in-flight runs when an agent pushes again to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip while a PR is a draft; always run on pushes to main.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret-scan diff range below can resolve both
          # the PR's base and head SHAs -- a shallow (default) clone wouldn't
          # have the base commit locally.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Core-API coherence
        run: python -m mythings._compat --check
      - name: Tests
        run: pytest --cov=mythings --cov-report=xml
      # Editing harness.md strands every sibling repo's vendored HARNESS.md
      # until a sweep lands, and each one's drift test turns red the next time
      # it builds. Only runs when this PR actually touches the canonical copy.
      # Not `--check`: that globs a workspace, and this runner has only core
      # checked out, so it would pass no matter how stale the fleet is.
      - name: Harness vendor drift (only when harness.md changes)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" | grep -qx 'src/mythings/harness.md'; then
            python -m mythings._harness --remote-check "${{ github.repository_owner }}"
          else
            echo "harness.md unchanged; skipping vendor-drift check"
          fi
      - name: Secret scan (added lines vs base)
        if: github.event_name == 'pull_request'
        run: |
          python -m mythings._secrets scan-diff-range \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
      - name: Secret scan (PR title + body)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json title,body --jq '.title + "\n" + .body' \
            | python -m mythings._secrets scan-text
      # Compares the __all__ surface at the last released tag (not the PR
      # base branch tip) against the PR head, so a surface addition that
      # already slipped onto main un-bumped one PR earlier still gets caught
      # here -- exactly how #202 got through: base-branch comparison alone
      # would have stayed silent. `release:deferred` opts a feature PR out
      # when it deliberately defers the bump to a later release PR (the
      # pattern #200 and release/v1.8.0 follow).
      - name: Public-surface delta vs last release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
              --json labels --jq '.labels[].name' | grep -qx 'release:deferred'; then
            echo "release:deferred label set; skipping surface/version gate"
          else
            base_tag="$(git describe --tags --abbrev=0 "${{ github.event.pull_request.base.sha }}")"
            python -m mythings._release check-surface "$base_tag" "${{ github.event.pull_request.head.sha }}"
          fi
      # Warn-only for now (continue-on-error): pip-audit's advisory DB flags a
      # lot of transitive dev-dependency noise the fleet hasn't triaged yet.
      # Tripwire first, gate once the false-positive rate is known -- see
      # docs/CONVENTIONS.md "Dependency-vulnerability scanning" for the plan
      # to flip this to a hard gate.
      - name: Dependency vulnerability scan (warn-only)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
